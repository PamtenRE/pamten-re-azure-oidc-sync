name: Sync Azure Credentials to All Repos

on:
  push:
    branches:
      - main
    paths:
      - 'repo-list.json'

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      ORG: PamtenRE
      CLIENT_ID: ${{ secrets.AZURE_DEV_CLIENT_ID }}
      TENANT_ID: ${{ secrets.AZURE_DEV_TENANT_ID }}
      SUBSCRIPTION_ID: ${{ secrets.AZURE_DEV_SUBSCRIPTION_ID }}
      GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Read repo list and update each
        run: |
          echo "Reading repo list..."
          REPOS=$(jq -r '.repos[]' repo-list.json)

          for repo in $REPOS; do
            echo "Updating Azure secrets in $repo"
            gh secret set AZURE_CLIENT_ID --body "$CLIENT_ID" -R "$ORG/$repo"
            gh secret set AZURE_TENANT_ID --body "$TENANT_ID" -R "$ORG/$repo"
            gh secret set AZURE_SUBSCRIPTION_ID --body "$SUBSCRIPTION_ID" -R "$ORG/$repo"
          done
