name: Sync Azure Credentials to Repos

on:
  push:
    branches:
      - develop
      - master
    paths:
      - 'repo-list.json'

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest

    # Dynamically set the environment name from the branch
    environment: ${{ github.ref_name == 'master' && 'prod' || 'dev' }}

    env:
      ORG: PamtenRE
      GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Determine environment dynamically
        id: env_selector
        run: |
          if [[ "${GITHUB_REF_NAME}" == "master" ]]; then
            echo "env_name=prod" >> $GITHUB_OUTPUT
          else
            echo "env_name=dev" >> $GITHUB_OUTPUT
          fi

      - name: Sync Azure credentials to repos
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          echo "Environment: ${{ steps.env_selector.outputs.env_name }}"
          echo "Reading repo list..."
          REPOS=$(jq -r '.repos[]' repo-list.json)

          for repo in $REPOS; do
            echo "Updating Azure secrets in $repo"
            gh secret set AZURE_CLIENT_ID --body "$CLIENT_ID" -R "$ORG/$repo"
            gh secret set AZURE_TENANT_ID --body "$TENANT_ID" -R "$ORG/$repo"
            gh secret set AZURE_SUBSCRIPTION_ID --body "$SUBSCRIPTION_ID" -R "$ORG/$repo"
            echo "Secrets updated for $repo"
          done
